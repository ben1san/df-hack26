<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>病棟と勤務の種類 — 勤務表</title>
<link rel="stylesheet" href="ui.css">
<style>
.pane{max-width:1000px}
.wname{width:100%; max-width:360px; font-size:16px; padding:11px 14px}
.kh,.kr{display:grid; grid-template-columns:52px 1fr 182px 44px 84px 56px 30px;
  align-items:center; gap:11px; padding:9px 14px}
.kh{font-size:11px; font-weight:700; letter-spacing:.04em; color:var(--ink3);
  border-bottom:1px solid var(--line2); background:var(--s2)}
.kh .r{text-align:right}
.kr{border-bottom:1px solid var(--line)}
.kr:last-of-type{border-bottom:none}
.kr.off{background:var(--s2)}
input.symin{width:44px; text-align:center; font-weight:700; font-size:15px}
input.nm{width:100%}
.times{display:flex; align-items:center; gap:5px; font-size:13px; color:var(--ink3)}
.col{width:28px;height:28px;border-radius:6px;border:1px solid var(--line2);
  padding:0;cursor:pointer;background:none}
.nt{text-align:right; font-variant-numeric:tabular-nums; font-size:14px; font-weight:600}
.nt.zero{color:var(--ink3); font-weight:400}
.nt.bit{color:#8a5a00}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme="light"])) .nt.bit{color:#f0c46a}}
.cnt{text-align:center} .cnt input{width:17px;height:17px;accent-color:var(--ink)}
.barwrap{grid-column:1/-1; padding:0 2px 3px}
.bar24{position:relative; height:15px; border-radius:4px; background:var(--s3); overflow:hidden}
.bar24 .night{position:absolute;top:0;bottom:0;background:var(--band)}
.bar24 .work{position:absolute;top:3px;bottom:3px;border-radius:3px}
.bar24 .over{position:absolute;top:3px;bottom:3px;border-radius:3px;
  background:repeating-linear-gradient(45deg,transparent,transparent 3px,rgba(0,0,0,.26) 3px,rgba(0,0,0,.26) 5px)}
@media (prefers-color-scheme: dark){:root:where(:not([data-theme="light"])) .bar24 .over{
  background:repeating-linear-gradient(45deg,transparent,transparent 3px,rgba(255,255,255,.33) 3px,rgba(255,255,255,.33) 5px)}}
.ticks{position:relative;height:12px;margin:3px 2px 0;font-size:9.5px;color:var(--ink3)}
.ticks i{position:absolute;transform:translateX(-50%);font-style:normal}
.preset{display:flex; gap:9px; align-items:center; flex-wrap:wrap; font-size:13.5px; color:var(--ink2)}
.pbtn{background:var(--s1); border:1px solid var(--line2); border-radius:8px; padding:6px 13px;
  font:inherit; font-size:13.5px; cursor:pointer; color:var(--ink); display:inline-flex; gap:3px; align-items:center}
.pbtn:hover{border-color:var(--ink)}
.pbtn i{width:22px;height:21px;border-radius:4px;display:grid;place-items:center;
  font-style:normal;font-size:11.5px;font-weight:700}
.y9{display:flex; align-items:center; gap:10px; flex-wrap:wrap; font-size:14px}
.y9 label{display:flex; align-items:center; gap:7px; cursor:pointer}
.y9 input[type=checkbox]{width:17px;height:17px;accent-color:var(--ink)}
.bandbox{opacity:.42; pointer-events:none; transition:opacity .15s}
.bandbox.on{opacity:1; pointer-events:auto}
.ok{font-size:12.5px;padding:3px 10px;border-radius:20px;border:1px solid var(--line2);color:var(--ink2)}
.ok.good{border-color:var(--good);color:var(--good)} .ok.bad{border-color:var(--crit);color:var(--crit)}
</style>
</head>
<body>
<div class="pane">
  <div class="step">A / 5</div>
  <h1>病棟と、勤務の種類。</h1>
  <p class="lede">3交代の既定を入れてあります。<b>おたくのものに直してください。</b></p>

  <div class="sec"><h2>病棟の名前</h2><div class="in">
    <input type="text" class="wname" id="wname" placeholder="例） 3階東病棟" autocomplete="off">
  </div></div>

  <div class="sec">
    <h2>勤務の種類<span class="r" id="kn"></span></h2>
    <div class="in" style="padding-bottom:9px">
      <div class="preset">既定を入れ替える：
        <button class="pbtn" data-p="3"><i class="k-日">日</i><i class="k-準">準</i><i class="k-深">深</i>3交代</button>
        <button class="pbtn" data-p="2"><i class="k-日">日</i><i class="k-夜">夜</i><i class="k-明">明</i>2交代</button>
      </div>
    </div>
    <div class="kh">
      <div>記号</div><div>名称</div><div>時間</div><div>色</div>
      <div class="r">うち夜勤時間</div><div class="r">人員</div><div></div>
    </div>
    <div id="rows"></div>
    <div class="in" style="border-top:1px solid var(--line2)">
      <button class="add" id="add">＋ 種類を足す</button>
      <span style="font-size:12.5px;color:var(--ink3);margin-left:12px">
        同じ時刻でも、対象が違えば別の種類にできます（例 日勤／日勤・リーダー）</span>
    </div>
  </div>

  <div class="sec">
    <h2>様式9</h2>
    <div class="in">
      <div class="y9"><label><input type="checkbox" id="y9"> この病棟で様式9を出す</label>
        <span style="font-size:12.5px;color:var(--ink3)">出すなら、夜勤時間帯の設定が要ります</span></div>
    </div>
  </div>

  <div class="sec bandbox" id="bandbox">
    <h2>夜勤時間帯</h2>
    <div class="in">
      <p style="margin:0 0 12px;font-size:13.5px;color:var(--ink2)">
        この帯の中で働いた時間が「夜勤時間」になります。月平均72時間の判定に使います。</p>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
        <input type="time" id="bstart" value="16:30">
        <span style="color:var(--ink3)">〜 翌</span>
        <b id="bend" style="font-variant-numeric:tabular-nums">08:30</b>
        <span class="ok">連続16時間</span><span class="ok" id="chk"></span>
      </div>
      <div class="box w" id="found" style="display:none;margin:13px 0 0"></div>
      <p style="margin:11px 0 0;font-size:12.5px;color:var(--ink3);line-height:1.7">
        22時と翌5時を含む連続16時間であれば、どこに置くかは病院が決められます。
        置き方で月平均夜勤時間数は動きます。</p>
    </div>
  </div>

  <div class="bar">
    <a class="back" id="back">勤務表を取り込む方法に戻る</a>
    <button class="go" id="go" disabled>次へ</button>
  </div>
</div>
<div id="note"></div>

<script>
const $=s=>document.getElementById(s), ce=(t,c)=>{const e=document.createElement(t); if(c)e.className=c; return e};
function note(t){const n=$('note'); n.innerHTML=t; n.classList.add('on');
  clearTimeout(n._t); n._t=setTimeout(()=>n.classList.remove('on'),2600)}
const DAY=1440, toM=t=>{const[a,b]=t.split(':').map(Number);return a*60+b};
const toT=m=>{m=((m%DAY)+DAY)%DAY;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const hm=m=>Math.floor(m/60)+':'+String(m%60).padStart(2,'0');

/* 色も設定項目。既定を置くが、病院の色に変えられる */
const P3=[{sym:'日',name:'日勤',s:'08:30',e:'17:15',c:'#2a78d6',count:true,work:true},
          {sym:'準',name:'準夜勤',s:'16:30',e:'01:15',c:'#eb6834',count:true,work:true},
          {sym:'深',name:'深夜勤',s:'00:30',e:'09:15',c:'#1baf7a',count:true,work:true},
          {sym:'休',name:'公休',s:null,e:null,c:'#9a9992',count:false,work:false}];
const P2=[{sym:'日',name:'日勤',s:'08:30',e:'17:15',c:'#2a78d6',count:true,work:true},
          {sym:'夜',name:'夜勤',s:'16:30',e:'09:00',c:'#1baf7a',count:true,work:true},
          {sym:'明',name:'明け',s:'09:00',e:'09:30',c:'#eb6834',count:false,work:true},
          {sym:'休',name:'公休',s:null,e:null,c:'#9a9992',count:false,work:false}];
let KINDS=JSON.parse(JSON.stringify(P3)), BAND='16:30', Y9=false;

const segs=(s,e)=>{const a=toM(s),b=toM(e);return (b>a?[[a,b]]:[[a,DAY],[0,b]]).filter(x=>x[1]>x[0])};
const bandSegs=()=>segs(BAND,toT(toM(BAND)+960));
const ov=(A,B)=>{let t=0;A.forEach(([a1,a2])=>B.forEach(([b1,b2])=>t+=Math.max(0,Math.min(a2,b2)-Math.max(a1,b1))));return t};
const nightMin=k=>k.work?ov(segs(k.s,k.e),bandSegs()):0;
const pct=m=>(m/DAY*100)+'%';

function drawRows(){
  const h=$('rows'); h.innerHTML='';
  KINDS.forEach((k,i)=>{
    const r=ce('div','kr'+(k.work?'':' off'));
    const si=ce('input'); si.className='symin k-'+k.sym; si.value=k.sym; si.maxLength=3;
    si.style.background=k.work?'':''; si.oninput=()=>{k.sym=si.value; render()}; r.appendChild(si);
    const ni=ce('input'); ni.className='nm'; ni.value=k.name; ni.oninput=()=>k.name=ni.value; r.appendChild(ni);
    const tw=ce('div','times');
    if(k.work){
      const a=ce('input'); a.type='time'; a.value=k.s; a.onchange=()=>{k.s=a.value; render()};
      const b=ce('input'); b.type='time'; b.value=k.e; b.onchange=()=>{k.e=b.value; render()};
      const d=ce('span'); d.textContent='–';
      tw.append(a,d,b);
      if(toM(k.e)<=toM(k.s)){const x=ce('span'); x.textContent='翌'; x.style.fontSize='12px'; tw.appendChild(x)}
    } else { const x=ce('span'); x.textContent='勤務しない'; tw.appendChild(x) }
    r.appendChild(tw);
    const ci=ce('input','col'); ci.type='color'; ci.value=k.c; ci.className='col';
    ci.oninput=()=>{k.c=ci.value; render()}; r.appendChild(ci);
    const nm=nightMin(k), nd=ce('div','nt'+(nm===0?' zero':nm<120?' bit':''));
    nd.textContent=k.work&&Y9?hm(nm):'—'; r.appendChild(nd);
    const cw=ce('div','cnt'); const cb=ce('input'); cb.type='checkbox'; cb.checked=k.count;
    cb.onchange=()=>k.count=cb.checked; cw.appendChild(cb); r.appendChild(cw);
    const dl=ce('button','del'); dl.textContent='×'; dl.title='この種類を消す';
    dl.onclick=()=>{KINDS.splice(i,1); render()}; r.appendChild(dl);
    if(k.work){
      const bw=ce('div','barwrap'), bar=ce('div','bar24');
      if(Y9) bandSegs().forEach(([a,b])=>{const n=ce('div','night');
        n.style.left=pct(a); n.style.width=pct(b-a); bar.appendChild(n)});
      const ws=segs(k.s,k.e);
      ws.forEach(([a,b])=>{const w=ce('div','work'); w.style.background=k.c;
        w.style.left=pct(a); w.style.width=pct(b-a); bar.appendChild(w)});
      if(Y9) ws.forEach(([a,b])=>bandSegs().forEach(([c,d])=>{
        const l=Math.max(a,c), rr=Math.min(b,d);
        if(rr>l){const o=ce('div','over'); o.style.left=pct(l); o.style.width=pct(rr-l); bar.appendChild(o)}}));
      bw.appendChild(bar); r.appendChild(bw);
    }
    h.appendChild(r);
  });
  const tk=ce('div','ticks');
  [0,6,12,18,24].forEach(x=>{const i=ce('i'); i.textContent=x+':00'; i.style.left=(x/24*100)+'%'; tk.appendChild(i)});
  h.appendChild(tk);
  $('kn').textContent=KINDS.length+'種類';
}
function drawBand(){
  $('bandbox').classList.toggle('on',Y9);
  $('bend').textContent=toT(toM(BAND)+960);
  const ok=ov([[22*60,DAY],[0,300]],bandSegs())===420;
  const c=$('chk'); c.className='ok '+(ok?'good':'bad');
  c.textContent=(ok?'✓ ':'✕ ')+'22:00〜翌5:00 を含む';
  const d=KINDS.find(k=>k.work&&nightMin(k)>0&&nightMin(k)<=120), f=$('found');
  if(Y9&&d){ f.style.display='block';
    f.innerHTML='<div class="hd"><span class="ico w">!</span>'+d.name+'（'+d.sym+'）が '+
      hm(nightMin(d))+' だけ夜勤時間帯にかかっています</div>'+
      'この分も月平均夜勤時間数に入ります。拘束が8時間を超える勤務は、帯をどこに置いても必ずかかります。';
  } else f.style.display='none';
}
function render(){drawRows(); drawBand(); $('go').disabled=!$('wname').value.trim()}

document.querySelectorAll('.pbtn').forEach(b=>b.onclick=()=>{
  KINDS=JSON.parse(JSON.stringify(b.dataset.p==='3'?P3:P2)); render();
  note((b.dataset.p==='3'?'3交代':'2交代')+'の既定を入れました。記号も時間も直せます')});
$('add').onclick=()=>{KINDS.splice(KINDS.length-1,0,
  {sym:'研',name:'研修',s:'09:00',e:'17:00',c:'#8b8a81',count:false,work:true}); render()};
$('y9').onchange=e=>{Y9=e.target.checked; render()};
$('bstart').onchange=e=>{BAND=e.target.value; render()};
$('wname').addEventListener('input',()=>$('go').disabled=!$('wname').value.trim());
$('back').onclick=()=>location.href='index.html';
$('go').onclick=()=>{
  try{ sessionStorage.setItem('kinds',JSON.stringify(KINDS));
       sessionStorage.setItem('ward',$('wname').value.trim());
       sessionStorage.setItem('y9',Y9?'1':'');
       sessionStorage.setItem('band',BAND); }catch(e){}
  location.href='s2.html'};
render(); $('wname').focus();
</script>
</body>
</html>
