<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>決まっているもの — 勤務表</title>
<link rel="stylesheet" href="ui.css">
<style>
.pane{max-width:820px}
.count{margin:0 0 22px;font-size:14.5px;color:var(--ink2)}
.count b{color:var(--ink);font-weight:700}
.it{display:flex;align-items:flex-start;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}
.it:last-child{border-bottom:none}
.it .lk{font-size:13px;color:var(--ink3);line-height:1.55;flex:0 0 auto;width:15px}
.it .bd{flex:1 1 auto;min-width:0}
.it .nm{font-size:15px;font-weight:500;line-height:1.5}
.it .src{font-size:12.5px;color:var(--ink3);margin-top:2px}
.it .src em{font-style:normal;color:var(--ink2)}
.off{background:none;border:none;font:inherit;font-size:13px;color:var(--ink3);
  text-decoration:underline;text-underline-offset:3px;cursor:pointer;opacity:0;
  flex:0 0 auto;padding:2px 0;transition:opacity .12s}
.it:hover .off{opacity:1}
.off:hover{color:var(--crit)}
.it.gone{background:var(--s2)}
.it.gone .nm{text-decoration:line-through;color:var(--ink3)}
.it.gone .off{opacity:1;color:var(--ink2)}
.rec{margin-top:5px;font-size:12.5px;background:var(--crit-bg);border:1px solid var(--crit);
  border-radius:7px;padding:6px 10px;color:var(--ink2)}
.it.locked .nm{font-weight:600}
.why{margin-top:9px;padding:11px 12px;border-radius:9px;background:var(--warn-bg);border:1px solid var(--warn)}
.why p{margin:0 0 8px;font-size:13.5px;font-weight:600}
.why .r{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.why input{flex:1 1 250px;min-width:0;font-size:14px}
.why button{font:inherit;font-size:13.5px;padding:8px 16px;border-radius:7px;cursor:pointer;
  border:1px solid var(--line2);background:var(--s1);color:var(--ink)}
.why button.do{background:var(--ink);color:var(--s1);border-color:var(--ink)}
.why button:disabled{opacity:.35;cursor:default}
.promise{background:var(--good-bg);border:1px solid var(--good);border-radius:12px;
  padding:15px 17px;margin-top:18px;font-size:14px;line-height:1.8}
</style>
</head>
<body>
<div class="pane">
  <div class="step">D / 5</div>
  <h1>ここは入れなくて大丈夫です。</h1>
  <p class="lede">法律と診療報酬、日本看護協会のガイドラインから、こちらで入れてあります。出どころも一緒に残します。</p>
  <p class="count"><b id="n">0</b>本 入っています。<span id="offn"></span></p>

  <div id="secs"></div>

  <div class="note">
    <h3>勤務表では守れないもの（入れていません）</h3>
    <ul><li>休憩は夜勤時に1時間以上とる</li><li>夜勤の途中に連続した仮眠をとる</li></ul>
    <p style="margin-top:7px">どちらも勤務の<b>中身</b>の話で、どの日に誰を置くかでは守れません。
      ガイドラインには入っていますが、この勤務表では扱いません。</p>
  </div>

  <div class="promise">
    <b>外せないのは「1日に1つの勤務」だけです。あとは全部外せます。</b><br>
    外すと、外した日・外した人・理由が残ります。いつでも戻せます。<b>承認する人は要りません。</b>
  </div>

  <div class="bar">
    <a class="back" id="back">C（前月から）に戻る</a>
    <button class="go" id="go">次へ</button>
  </div>
</div>
<div id="note"></div>

<script>
const $=s=>document.getElementById(s), ce=(t,c)=>{const e=document.createElement(t); if(c)e.className=c; return e};
function note(t){const n=$('note'); n.innerHTML=t; n.classList.add('on');
  clearTimeout(n._t); n._t=setTimeout(()=>n.classList.remove('on'),2600)}

/* A で決めたことを引き継ぐ */
let band='16:30', bandEnd='08:30', y9=false, kinds=[];
try{ band=sessionStorage.getItem('band')||band;
     y9=!!sessionStorage.getItem('y9');
     kinds=JSON.parse(sessionStorage.getItem('kinds')||'[]'); }catch(e){}
(function(){const [h,m]=band.split(':').map(Number); const t=(h*60+m+960)%1440;
  bandEnd=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')})();
const three = kinds.filter(k=>k.work).length>=3 && kinds.some(k=>/準/.test(k.sym));

const SECS=[
 {t:'表の形', items:[{nm:'1日に1つの勤務', src:'勤務表そのものの形', lock:1}]},
 {t:'法律・診療報酬から', items:[
   {nm:'月平均夜勤時間数は72時間以下（病棟の集計）',
    src:'診療報酬 入院基本料の要件'+(y9
      ? ' ・ <em>A で決めた夜勤時間帯 '+band+'〜翌'+bandEnd+' で数えます</em>'
      : ' ・ <em>A で様式9を出さない設定なので、集計だけに使います</em>')},
   {nm:'夜勤は看護師1名を含む2人以上',
    src:'急性期一般入院基本料・7対1・10対1・13対1 などの施設基準'},
   {nm:'毎週1日、または4週で4日の休み', src:'労働基準法 第35条'}]},
 {t:'日本看護協会のガイドラインから', sub:'勤務編成の基準', items:[
   {nm:'勤務と勤務の間は11時間以上あける', src:'基準①'},
   {nm:'拘束時間は13時間以内', src:'基準②'},
   {nm:'夜勤は月8回まで'+(three?'':'（3交代の基準。おたくは3交代ではないので外しておきました）'),
    src:'基準③', auto:!three},
   {nm:'夜勤は連続2回まで', src:'基準④'},
   {nm:'連続勤務は5日まで', src:'基準⑤'},
   {nm:'夜勤のあとは概ね24時間以上あける（2回連続なら概ね48時間以上）', src:'基準⑧'},
   {nm:'土日ともに休める週末を月1回つくる', src:'基準⑨'},
   {nm:'交代の向きは正循環', src:'基準⑩'},
   {nm:'早出は7時より前に始めない', src:'基準⑪'}]}];

/* 2交代なら「夜勤は月8回まで」を自動で外しておく */
SECS[2].items.forEach(it=>{ if(it.auto) it.gone={d:'2026-11-08',w:'システム',r:'3交代の基準のため'} });

const today='2026-11-08', who='師長';
let asking=null;

function draw(){
  const h=$('secs'); h.innerHTML=''; let total=0, gone=0;
  SECS.forEach((s,si)=>{
    const sec=ce('div','sec');
    sec.innerHTML='<h2>'+s.t+(s.sub?' <span style="font-weight:500">'+s.sub+'</span>':'')+
      '<span class="r">'+s.items.filter(i=>!i.gone).length+' / '+s.items.length+'</span></h2>';
    s.items.forEach((it,ii)=>{
      total++; if(it.gone)gone++;
      const d=ce('div','it'+(it.gone?' gone':'')+(it.lock?' locked':''));
      d.innerHTML='<div class="lk">'+(it.lock?'🔒':'')+'</div><div class="bd">'+
        '<div class="nm">'+it.nm+'</div><div class="src">'+it.src+'</div>'+
        (it.gone?'<div class="rec">外しました　'+it.gone.d+' ・ '+it.gone.w+' ・ 理由「'+it.gone.r+'」</div>':'')+
        '</div>';
      if(!it.lock){
        const b=ce('button','off'); b.textContent=it.gone?'戻す':'外す';
        b.onclick=()=>{ if(it.gone){it.gone=null; draw(); note('戻しました。外した記録は履歴に残ります'); return}
          asking=[si,ii]; draw() };
        d.appendChild(b);
      }
      if(asking&&asking[0]===si&&asking[1]===ii&&!it.gone){
        const w=ce('div','why'); w.style.width='100%';
        w.innerHTML='<p>なぜ外しますか。あとで読む人のために残します。</p>'+
          '<div class="r"><input placeholder="例） 変形労働時間制をとっているため">'+
          '<button class="do" disabled>外す</button><button class="no">やめる</button></div>';
        const inp=w.querySelector('input'), ok=w.querySelector('.do');
        inp.oninput=()=>ok.disabled=!inp.value.trim();
        ok.onclick=()=>{it.gone={d:today,w:who,r:inp.value.trim()}; asking=null; draw(); note('外しました。記録が残ります')};
        w.querySelector('.no').onclick=()=>{asking=null; draw()};
        d.querySelector('.bd').appendChild(w); setTimeout(()=>inp.focus(),0);
      }
      sec.appendChild(d);
    });
    h.appendChild(sec);
  });
  $('n').textContent=total-gone;
  $('offn').textContent=gone?'（'+gone+'本を外しました）':'';
}
$('back').onclick=()=>location.href='s3.html';
$('go').onclick=()=>location.href='s5.html';
draw();
</script>
</body>
</html>
