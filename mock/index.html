<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>勤務表</title>
<style>
:root{
  color-scheme: light;
  --s1:#fcfcfb; --s2:#f5f4f1; --s3:#ecebe6;
  --line:#dddcd5; --line2:#bcbbb3;
  --ink:#111110; --ink2:#55544f; --ink3:#8b8a81;
  --accent:#2a78d6;
}
@media (prefers-color-scheme: dark){
 :root:where(:not([data-theme="light"])){
  color-scheme: dark;
  --s1:#1f1f1e; --s2:#171716; --s3:#2a2a28;
  --line:#3a3a37; --line2:#55554f;
  --ink:#ffffff; --ink2:#c3c2b7; --ink3:#8f8e85;
  --accent:#3987e5;
 }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--s2); color:var(--ink);
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",sans-serif;
  font-feature-settings:"palt" 1;
  display:grid; place-items:center; padding:32px;
}

.pane{width:100%; max-width:560px}

h1{margin:0 0 10px; font-size:23px; line-height:1.6; font-weight:700; letter-spacing:.01em}
.lede{margin:0 0 30px; color:var(--ink2); font-size:15px}

/* ---------- 受け口 ---------- */
.drop{
  background:var(--s1); border:2px dashed var(--line2); border-radius:14px;
  padding:42px 28px; text-align:center; transition:border-color .15s, background .15s;
}
.drop.over{border-color:var(--accent); background:var(--s3)}
.drop .big{font-size:16px; font-weight:600; margin-bottom:4px}
.drop .or{color:var(--ink3); font-size:13.5px; margin:14px 0}
.pick{
  background:var(--ink); color:var(--s1); border:none; border-radius:9px;
  padding:13px 32px; font:inherit; font-size:15.5px; font-weight:600;
  letter-spacing:.04em; cursor:pointer;
}
.pick:hover{opacity:.86}
.pick:active{transform:translateY(1px)}
.types{margin-top:20px; font-size:12.5px; color:var(--ink3); letter-spacing:.02em}

/* ---------- 受け取ったあと ---------- */
.got{display:none; align-items:center; gap:13px; justify-content:center; text-align:left}
.got.on{display:flex}
.drop.done{border-style:solid; border-color:var(--line)}
.drop.done .ask{display:none}
.fileicon{width:38px;height:46px;border:1.5px solid var(--line2);border-radius:4px;
  flex:0 0 auto; position:relative; background:var(--s1)}
.fileicon::after{content:""; position:absolute; top:0; right:0; width:11px;height:11px;
  background:var(--s3); border-left:1.5px solid var(--line2); border-bottom:1.5px solid var(--line2)}
.fname{font-size:14.5px; font-weight:600; word-break:break-all}
.fsub{font-size:12.5px; color:var(--ink3)}
.next{margin-top:22px; display:none}
.next.on{display:block}
.next button{width:100%; background:var(--ink); color:var(--s1); border:none; border-radius:9px;
  padding:14px; font:inherit; font-size:15.5px; font-weight:600; letter-spacing:.04em; cursor:pointer}
.next button:hover{opacity:.86}

/* ---------- 下の2行 ---------- */
.why{margin:28px 0 0; font-size:14px; color:var(--ink2); line-height:1.8}
.why b{color:var(--ink); font-weight:600}
.esc{margin:18px 0 0; font-size:13.5px}
.esc a{color:var(--ink3); text-decoration:underline; text-underline-offset:3px; cursor:pointer}
.esc a:hover{color:var(--ink2)}

#note{position:fixed; left:50%; bottom:40px; transform:translateX(-50%);
  background:var(--ink); color:var(--s1); padding:10px 18px; border-radius:9px;
  font-size:13.5px; opacity:0; pointer-events:none; transition:opacity .25s; max-width:90vw}
#note.on{opacity:1}
</style>
</head>
<body>

<div class="pane">

  <h1>いつも使っている勤務表を、1つ入れてください。</h1>
  <p class="lede">先月のものがあれば、それがいちばん助かります。</p>

  <div class="drop" id="drop">
    <div class="ask">
      <div class="big">ここにドラッグ</div>
      <div class="or">または</div>
      <button class="pick" id="pick">ファイルを選ぶ</button>
      <div class="types">Excel ・ CSV ・ PDF ・ 写真</div>
    </div>
    <div class="got" id="got">
      <div class="fileicon"></div>
      <div>
        <div class="fname" id="fname"></div>
        <div class="fsub" id="fsub"></div>
      </div>
    </div>
  </div>

  <div class="next" id="next"><button id="go">読み取る</button></div>

  <p class="why">名簿も、勤務の記号も、この表から読み取ります。<br>
     <b>設定することはありません。</b></p>

  <p class="esc"><a id="none">勤務表が用意できない</a></p>

  <input type="file" id="file" hidden>
</div>

<div id="note"></div>

<script>
const $=s=>document.getElementById(s);
const drop=$('drop');

function note(t){const n=$('note'); n.textContent=t; n.classList.add('on');
  clearTimeout(n._t); n._t=setTimeout(()=>n.classList.remove('on'),2200)}

function accept(f){
  const kb=f.size<1024?f.size+' B':f.size<1048576?Math.round(f.size/1024)+' KB'
          :(f.size/1048576).toFixed(1)+' MB';
  $('fname').textContent=f.name;
  $('fsub').textContent=kb;
  $('got').classList.add('on');
  drop.classList.add('done');
  $('next').classList.add('on');
}

$('pick').onclick=()=>$('file').click();
$('file').onchange=e=>{if(e.target.files[0])accept(e.target.files[0])};

['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{
  e.preventDefault(); drop.classList.add('over')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{
  e.preventDefault(); drop.classList.remove('over')}));
drop.addEventListener('drop',e=>{const f=e.dataTransfer.files[0]; if(f)accept(f)});

$('go').onclick=e=>{const b=e.target; b.textContent='読み取っています…'; b.disabled=true;
  setTimeout(()=>location.href='p2.html',1500)};
$('none').onclick=()=>location.href='s1.html';
</script>
</body>
</html>
