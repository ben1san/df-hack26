<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2026年11月 — 勤務表</title>
<link rel="stylesheet" href="ui.css">
<style>
body{display:flex;flex-direction:column;padding:0;overflow:hidden;height:100vh}
/* 上 */
.top{flex:0 0 auto;background:var(--s1);border-bottom:1px solid var(--line2);
  padding:11px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top h1{margin:0;font-size:16px;font-weight:700}
.top .mon{font-size:15px;font-weight:600;color:var(--ink2)}
.state{font-size:12.5px;color:var(--ink3);display:flex;align-items:center;gap:7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink3);flex:0 0 auto}
.dot.g{background:var(--good)} .dot.w{background:var(--warn)}
/* 表 */
.scroll{flex:1 1 auto;overflow:auto;padding:0 0 10px}
table{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums}
th,td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0}
thead th{position:sticky;top:0;z-index:2;background:var(--s1);
  border-bottom:1px solid var(--line2)!important}
.nmc{position:sticky;left:0;z-index:3;background:var(--s1);min-width:168px;max-width:168px;
  text-align:left;padding:0 10px!important;border-right:1px solid var(--line2)!important}
tbody .nmc{display:flex;align-items:center;gap:4px}
tbody .nmc .nm{flex:1 1 auto;min-width:0}
thead .nmc{z-index:4}
.dh{min-width:31px;width:31px;padding:3px 0!important;text-align:center;
  font-size:10.5px;font-weight:600;color:var(--ink2);line-height:1.25}
.dh u{display:block;font-size:9.5px;font-weight:500;color:var(--ink3);text-decoration:none}
.dh.sat{background:var(--d-bg);color:var(--d-fg)}
.dh.sun,.dh.hol{background:var(--crit-bg);color:#8d2b2b}
.dh.prev{background:var(--s3);color:var(--ink3)}
.edge{border-right:2px solid var(--ink)!important}
tbody tr{height:29px}
.nmc .nm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{flex:0 0 auto}
.nmc .nm i{font-style:normal;font-size:10px;color:var(--ink3);margin-left:5px}
td.c{width:31px;text-align:center;font-size:13px;font-weight:700;position:relative}
td.c .v{display:grid;place-items:center;width:100%;height:29px}
td.c.on{cursor:pointer}
td.c.on:hover{outline:2px solid var(--ink);outline-offset:-2px;z-index:1}
td.c.empty .v{background:repeating-linear-gradient(45deg,transparent,transparent 3px,var(--s3) 3px,var(--s3) 4px)}
td.prev{background:var(--s3)}
td.prev .v{opacity:.62}
td.kib::after{content:"";position:absolute;top:2px;right:2px;width:4px;height:4px;
  border-radius:50%;background:var(--ink)}
td.edited::before{content:"";position:absolute;left:0;bottom:0;width:0;height:0;
  border-left:7px solid var(--ink);border-top:7px solid transparent}
td.just .v{animation:drop .4s ease-out}
@keyframes drop{from{opacity:0;transform:scale(.6)}}
.sumh{min-width:38px;width:38px;font-size:9.5px;font-weight:600;color:var(--ink2);
  text-align:center;padding:3px 2px!important;border-left:1px solid var(--line2)!important;line-height:1.2}
td.sum{width:38px;text-align:center;font-size:12px;color:var(--ink2);
  border-left:1px solid var(--line2)!important}
td.sum.bad{color:var(--crit);font-weight:700;background:var(--crit-bg)}
tfoot td{background:var(--s2);height:24px;text-align:center;font-size:10.5px;color:var(--ink2);
  border-top:1px solid var(--line2)!important}
tfoot td.nmc{background:var(--s2);font-size:10.5px;color:var(--ink3);font-weight:600}
tfoot td.lo{color:var(--crit);font-weight:700;background:var(--crit-bg)}
/* 下 */
.foot{flex:0 0 auto;background:var(--s1);border-top:1px solid var(--line2);
  padding:13px 20px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.foot .t{font-size:15px;line-height:1.6}
.foot .t b{font-weight:700}
.foot .t span{display:block;font-size:13px;color:var(--ink2)}
.foot .go{margin-left:auto;padding:12px 30px}
.foot .alt{background:none;border:1px solid var(--line2);border-radius:9px;padding:11px 20px;
  font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.foot .alt:hover{border-color:var(--ink)}
/* 希望休の控え */
#side{position:fixed;right:16px;bottom:88px;z-index:40;width:290px;background:var(--s1);
  border:1px solid var(--line2);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.12);display:none}
#side.on{display:block}
#side h3{margin:0;padding:10px 13px;font-size:12px;font-weight:700;letter-spacing:.04em;
  color:var(--ink3);background:var(--s2);border-bottom:1px solid var(--line2)}
.kr{display:flex;align-items:center;gap:9px;padding:7px 13px;border-bottom:1px solid var(--line);
  font-size:13px;cursor:pointer}
.kr:last-child{border-bottom:none}
.kr:hover{background:var(--s3)}
.kr.done{color:var(--ink3)}
.kr .ck{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line2);flex:0 0 auto;
  display:grid;place-items:center;font-size:10px;color:transparent}
.kr.done .ck{background:var(--good);border-color:var(--good);color:#fff}
.kr .src{margin-left:auto;font-size:11px;color:var(--ink3)}
#pop{position:fixed;z-index:60;display:none;background:var(--s1);border:1px solid var(--line2);
  border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);padding:9px}
#pop .hd{font-size:11.5px;color:var(--ink3);margin-bottom:7px}
#pop .row{display:flex;gap:5px}
#pop button{width:36px;height:34px;border-radius:6px;border:1px solid var(--line2);
  font:inherit;font-size:14px;font-weight:700;cursor:pointer;background:var(--s1);color:var(--ink)}
#pop button:hover{border-color:var(--ink)}
#pop button.no{opacity:.4}
/* 反復のバッジ */
.badge{background:var(--ink);color:var(--s1);border:none;border-radius:11px;
  padding:1px 7px;font:inherit;font-size:10px;font-weight:700;cursor:pointer;margin-left:5px;
  vertical-align:middle;letter-spacing:.02em}
.badge:hover{opacity:.84}
.badge.soft{background:var(--warn);color:#000}
/* 右の引き出し */
#dw{position:fixed;top:0;right:0;bottom:0;width:410px;z-index:45;background:var(--s2);
  border-left:1px solid var(--line2);overflow-y:auto;padding:14px;display:none;
  flex-direction:column;gap:13px}
#dw.on{display:flex}
body.dw .scroll,body.dw .foot,body.dw .top{padding-right:426px}
#flow{border-color:var(--ink);box-shadow:0 2px 14px rgba(0,0,0,.1)}
#flow>h2{background:var(--ink);color:var(--s1);border-bottom:none}
#flow>h2 .x{margin-left:auto;background:none;border:none;color:inherit;font-size:15px;
  cursor:pointer;padding:0 2px;line-height:1}
.done{display:flex;gap:9px;align-items:baseline;padding:7px 14px;border-bottom:1px solid var(--line);
  font-size:12px;color:var(--ink2);background:var(--s2)}
.done .k{flex:0 0 46px;color:var(--ink3);font-size:11px}
.done .v{color:var(--ink);font-weight:500}
.q{font-size:14.5px;font-weight:700;margin:0 0 5px}
.sub{font-size:12.5px;color:var(--ink2);margin:0 0 11px;line-height:1.7}
.facts{background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;
  margin:0 0 11px;font-size:12.5px;color:var(--ink2)}
.facts .big{font-size:14px;font-weight:700;color:var(--ink);display:block;margin-bottom:5px}
.facts code{background:var(--s3);padding:1px 6px;border-radius:4px;font-size:11.5px;
  font-family:ui-monospace,Menlo,monospace}
.opt{display:block;width:100%;text-align:left;background:var(--s1);border:1px solid var(--line2);
  border-radius:8px;padding:9px 11px;margin-bottom:7px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.opt:hover{border-color:var(--ink);background:var(--s3)}
.opt .os{display:block;font-size:11.5px;color:var(--ink3);margin-top:2px}
.row2{display:flex;gap:7px;margin-top:11px}
.row2 button{flex:1;font:inherit;font-size:13.5px;padding:9px 10px;border-radius:8px;cursor:pointer;
  border:1px solid var(--line2);background:var(--s1);color:var(--ink)}
.row2 button.pri{background:var(--ink);color:var(--s1);border-color:var(--ink)}
.chg{display:flex;justify-content:space-between;font-size:12px;padding:4px 0;
  border-bottom:1px dashed var(--line)}
.chg:last-child{border-bottom:none}
.chg .ar{color:var(--ink3);font-variant-numeric:tabular-nums}
.srk{text-decoration:line-through;opacity:.45}
.mini{display:flex;gap:2px;margin:8px 0 3px}
.mini div{width:30px;text-align:center}
.mini .md{color:var(--ink3);font-size:10px;line-height:1.2}
.mini .mc{height:26px;display:grid;place-items:center;border-radius:4px;font-weight:700;
  font-size:12px;margin-top:2px}
.fake{font-size:11px;color:var(--ink3);border:1px dashed var(--line2);border-radius:6px;
  padding:5px 8px;margin-top:9px}
textarea{width:100%;min-height:70px;resize:vertical;font:inherit;font-size:13px;padding:9px 10px;
  border:1px solid var(--line2);border-radius:8px;background:var(--s1);color:var(--ink)}
.quote{border-left:3px solid var(--line2);padding:2px 0 2px 10px;color:var(--ink2);
  font-size:12.5px;margin:8px 0}
.sp{width:12px;height:12px;border:2px solid var(--line2);border-top-color:var(--ink);
  border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.rule{padding:10px 13px;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:none}
.rt{font-size:13px;font-weight:600;display:flex;gap:7px;align-items:baseline;flex-wrap:wrap}
.tag{font-size:10px;padding:1px 6px;border-radius:20px;border:1px solid var(--line2);
  color:var(--ink2);font-weight:600}
.tag.new{background:var(--good);border-color:var(--good);color:#fff}
.rm{font-size:11px;color:var(--ink3);margin-top:3px;line-height:1.55}
.cell-prev{outline:2px solid var(--warn)!important;outline-offset:-2px;z-index:1}
</style>
</head>
<body>

<div class="top">
  <h1 id="ward">3階東病棟</h1>
  <span class="mon" id="mon">2026年11月</span>
  <span class="state"><span class="dot" id="dot"></span><span id="st"></span></span>
</div>

<div class="scroll"><table id="t"></table></div>

<div class="foot">
  <div class="t" id="ft"></div>
  <span id="acts"></span>
</div>

<div id="side"><h3>手元の希望休</h3><div id="kib"></div></div>
<div id="dw"><div id="flowhost"></div><div id="ruleshost"></div></div>
<div id="pop"></div>
<div id="note"></div>

<script>
const $=s=>document.getElementById(s), ce=(t,c)=>{const e=document.createElement(t); if(c)e.className=c; return e};
function note(t,n){const x=ce('div'); x.style.cssText=
  'background:var(--ink);color:var(--s1);padding:9px 15px;border-radius:8px;font-size:13px;margin-top:7px';
  x.innerHTML=t+(n?' <span style="opacity:.6;font-size:11.5px">'+n+'</span>':'');
  let h=$('toasts'); if(!h){h=ce('div'); h.id='toasts';
    h.style.cssText='position:fixed;left:18px;bottom:88px;z-index:70;display:flex;flex-direction:column';
    document.body.appendChild(h)}
  h.appendChild(x); setTimeout(()=>{x.style.transition='opacity .3s'; x.style.opacity=0;
    setTimeout(()=>x.remove(),320)},3200)}

/* ===== 設定を受け取る ===== */
const get=(k,d)=>{try{const v=sessionStorage.getItem(k); return v?JSON.parse(v):d}catch(e){return d}};
const ward=(()=>{try{return sessionStorage.getItem('ward')||'3階東病棟'}catch(e){return '3階東病棟'}})();
let KINDS=get('kinds',null)||[{sym:'日',name:'日勤',c:'#2a78d6',work:true,count:true},
  {sym:'準',name:'準夜勤',c:'#eb6834',work:true,count:true},
  {sym:'深',name:'深夜勤',c:'#1baf7a',work:true,count:true},
  {sym:'休',name:'公休',c:'#9a9992',work:false,count:false}];
let PEOPLE=get('people',[]);
if(!PEOPLE.length) PEOPLE=['田中 美咲|正看護師 主任','佐藤 恵|正看護師','鈴木 彩|正看護師',
 '高橋 理恵|正看護師','伊藤 奈美|正看護師','渡辺 真由|正看護師','山本 由紀|正看護師',
 '中村 さくら|准看護師','小林 千尋|准看護師','加藤 瑞希|正看護師','吉田 遥|新人','山田 杏|新人 時短']
 .map(s=>{const[a,b]=s.split('|'); return {name:a,g:b,sh:KINDS.filter(k=>k.work).map(k=>k.sym)}});
PEOPLE.forEach(p=>{ if(!p.sh||!p.sh.length) p.sh=KINDS.filter(k=>k.work).map(k=>k.sym) });
const PREVG=get('prev',null);
const RULES=get('rules',null);
const OFF=+(()=>{try{return sessionStorage.getItem('off')||9}catch(e){return 9}})();


$('ward').textContent=ward;
const WORK=KINDS.filter(k=>k.work), SYM=KINDS.map(k=>k.sym);
const NIGHT=WORK.filter(k=>/夜/.test(k.name||'')).map(k=>k.sym);
const DEEP=NIGHT[NIGHT.length-1], OFFSYM=(KINDS.find(k=>!k.work)||{sym:'休'}).sym;
const col=s=>{const k=KINDS.find(x=>x.sym===s); return k?k.c:'#9a9992'};
const isWork=s=>{const k=KINDS.find(x=>x.sym===s); return !!(k&&k.work)};

/* ===== 11月 ===== */
const W='日月火水木金土';
const MONTHS=[
 {id:'2026-11', label:'2026年11月', n:30, start:0, hol:{3:'文化の日',23:'勤労感謝の日'},
  prevLabel:'10月', prevDays:['10/26','10/27','10/28','10/29','10/30','10/31'], prevWd:['月','火','水','木','金','土']},
 {id:'2026-12', label:'2026年12月', n:31, start:2, hol:{},
  prevLabel:'11月', prevDays:['11/25','11/26','11/27','11/28','11/29','11/30'], prevWd:['水','木','金','土','日','月']},
 {id:'2027-01', label:'2027年1月', n:31, start:5, hol:{1:'元日',11:'成人の日'},
  prevLabel:'12月', prevDays:['12/26','12/27','12/28','12/29','12/30','12/31'], prevWd:['土','日','月','火','水','木']},
 {id:'2027-02', label:'2027年2月', n:28, start:1, hol:{11:'建国記念の日',23:'天皇誕生日'},
  prevLabel:'1月', prevDays:['1/26','1/27','1/28','1/29','1/30','1/31'], prevWd:['火','水','木','金','土','日']}];
let mi=0;
let DAYS=MONTHS[0].n;
const wd=d=>W[(d-1+MONTHS[mi].start)%7];
const isWE=d=>'土日'.includes(wd(d)), isHOL=d=>!!MONTHS[mi].hol[d];
const HOLnow=()=>MONTHS[mi].hol;
const inGroup=(g,d)=> g==='毎日'?true : g==='平日'?(!isHOL(d)&&!isWE(d))
  : g==='土日'?isWE(d) : g==='祝日'?isHOL(d) : (isWE(d)||isHOL(d));
/* 前月の末尾6日 */
/* C で入れた10月末。直接開いたときは同じ仕込みを使う */
const PSEED={0:['日','日','','日','日','日'], 1:['','準','深','','深',''],
             3:['日','日','日','日','日','日'], 6:['深','','日','','日',''],
             8:['準','深','','日','日','準']};
const PREV=PREVG&&PREVG.length===PEOPLE.length?PREVG
  :PEOPLE.map((_,i)=>(PSEED[i]||Array(6).fill('')).slice());

/* 人数の決まり */
const DEF=[{g:'平日',sh:['日'],who:'全員',n:4,lv:'強く'},{g:'土日祝',sh:['日'],who:'全員',n:3,lv:'強く'}]
  .concat(NIGHT.map(s=>({g:'毎日',sh:[s],who:'全員',n:2,lv:'絶対',law:1})))
  .concat([{g:'毎日',sh:NIGHT.slice(),who:'正看護師',n:1,lv:'絶対',law:1}]);
const R=(RULES&&RULES.length)?RULES:DEF;
const minFor=(sym,d)=>{let m=0; R.forEach(r=>{ if(r.who==='全員'&&r.sh.includes(sym)&&inGroup(r.g,d))
  m=Math.max(m,r.n)}); return m};

/* ===== 状態 ===== */
let phase=0, G=PEOPLE.map(()=>Array(DAYS).fill('')), KIB={}, EDIT={}, just={};
let PROP=PEOPLE.map(()=>Array(DAYS).fill(''));   /* ソルバが置いたもの。解き直すまで変えない */
let EDITS=[];                                    /* 今月の手修正イベント（追記のみ） */
let MYRULES=[
 {t:'吉田 遥 は深夜勤に入らない', sc:'allwd', K:{r:10,w:'',sym:'深'},
  term:'2026-12-31 まで', expMi:2, src:'2026-06-10 導入時 · 師長が「期限つき」を選択',
  born:'2026-06-10', pre:1},
 {t:'新人は深夜勤をひとりにしない', sc:'allp', K:{r:-1,w:'',sym:'深'},
  term:'恒久', idleMi:2, last:'2026-05', src:'2026-08-21 導入時 · 過去3ヶ月の表から検出',
  born:'2026-08-21', pre:1}
], flow=null, preview=null, applied=false;
let THISMON='2026-11';

/* 仕込み — 過去3ヶ月の手修正。本番では取り込み時にソルバを走らせて差分から作る */
const SEED=[['2026-08',0,'日','準'],['2026-08',0,'金','深'],['2026-08',1,'水','準'],['2026-08',3,'木','準'],
['2026-08',4,'木','深'],['2026-08',5,'木','日'],['2026-08',5,'水','深'],['2026-08',7,'土','日'],
['2026-08',10,'月','準'],['2026-08',11,'日','準'],['2026-08',11,'月','日'],['2026-08',11,'木','日'],
['2026-09',0,'水','深'],['2026-09',0,'金','深'],['2026-09',1,'日','日'],['2026-09',4,'日','準'],
['2026-09',5,'月','準'],['2026-09',6,'日','日'],['2026-09',7,'日','日'],['2026-09',7,'日','深'],
['2026-09',7,'月','深'],['2026-09',10,'土','深'],['2026-09',10,'火','日'],['2026-09',11,'金','準'],
['2026-10',0,'金','日'],['2026-10',1,'木','準'],['2026-10',1,'火','準'],['2026-10',4,'月','日'],
['2026-10',4,'木','準'],['2026-10',7,'水','日'],['2026-10',8,'日','深'],['2026-10',8,'木','準'],
['2026-10',8,'火','日'],['2026-10',9,'火','日'],['2026-10',10,'木','準'],['2026-10',11,'木','深'],
['2026-09',1,'金','深'],['2026-10',1,'金','深']];

/* 鍵 = 人 | 曜日 | 外された勤務。直した後は鍵に入れない */
const kkey=(r,w,from)=>r+'|'+w+'|'+from;
function monthsOf(k){
  const m=new Set();
  SEED.forEach(([mo,r,w,f])=>{ if(kkey(r,w,f)===k) m.add(mo) });
  EDITS.forEach(e=>{ if(kkey(e.r,e.w,e.from)===k) m.add(e.m) });
  return m;
}
const MONSEQ=['2026-08','2026-09','2026-10','2026-11'];
function streak(k){                       /* 直近から何ヶ月連続か */
  const m=monthsOf(k); let n=0;
  for(let i=MONSEQ.length-1;i>=0;i--){ if(m.has(MONSEQ[i]))n++; else if(n) break }
  return n;
}
/* 閾値は手修正の量から決める。誤検出の期待数 K×pⁿ を 1/12 未満に */
function threshold(){
  const K=PEOPLE.filter(p=>p.sh.some(x=>NIGHT.includes(x))).length*7*WORK.length || 1;
  const past=['2026-08','2026-09','2026-10'];
  const avg=past.reduce((a,m)=>a+SEED.filter(e=>e[0]===m).length,0)/past.length;
  const p=Math.min(0.9,avg/K);
  let n=2; while(K*Math.pow(p,n)>1/12 && n<9) n++;
  return {n, K, avg:Math.round(avg), p};
}
const TH=threshold();
/* その行で閾値に達している鍵 */
function hotKeys(r){
  const out=[];
  const seen=new Set();
  [...SEED.filter(e=>e[1]===r).map(e=>kkey(e[1],e[2],e[3])),
   ...EDITS.filter(e=>e.r===r).map(e=>kkey(e.r,e.w,e.from))].forEach(k=>{
     if(seen.has(k))return; seen.add(k);
     if(streak(k)>=TH.n && !MYRULES.some(x=>x.key===k)) out.push(k);
   });
  return out;
}
const KIBLIST=[[3,9,'10/22 紙'],[5,22,'10/23 LINE'],[8,3,'10/21 紙'],
               [11,28,'10/24 口頭'],[2,15,'10/22 LINE'],[4,7,'10/25 紙']]

/* 前月からの連続勤務 */
function prevRun(r){let n=0; for(let i=5;i>=0;i--){const v=PREV[r][i]; if(v&&isWork(v))n++; else break} return n}
function prevLast(r){return PREV[r][5]||''}
function at(r,d){ return d<0 ? (PREV[r][6+d]||'') : G[r][d] }
function runBefore(r,d){let n=0; for(let i=d-1;i>=-6;i--){const v=at(r,i); if(v&&isWork(v))n++; else break} return n}

/* ===== 解く ===== */
/* d に勤務を置いたとき、その日を含む連続勤務の長さ */
function blockLen(r,d){
  let n=1;
  for(let i=d-1;i>=-6;i--){const v=at(r,i); if(v&&isWork(v))n++; else break}
  for(let i=d+1;i<DAYS;i++){const v=G[r][i]; if(v&&isWork(v))n++; else break}
  return n;
}
const MAXRUN=5, TARGET=DAYS-OFF, MAXNIGHT=8;   /* 月8回 — 看護協会 基準③ */
const nights=r=>G[r].reduce((a,v)=>a+(NIGHT.includes(v)?1:0),0);
const worked=r=>G[r].reduce((a,v)=>a+(v&&isWork(v)?1:0),0);
const reg=r=>/正看護師|主任|師長/.test(PEOPLE[r].g||'');

function solveNight(){
  let p=0;
  const free=(r,d,s)=>{
    if(G[r][d])return false;
    if(KIB[r+'-'+d])return false;
    if(!PEOPLE[r].sh.includes(s))return false;
    const yv=at(r,d-1); if(yv&&NIGHT.includes(yv))return false;   // 夜勤の翌日は空ける
    if(d+1<DAYS&&G[r][d+1]&&isWork(G[r][d+1])&&s===DEEP)return false;
    if(blockLen(r,d)>MAXRUN)return false;                         // 連続勤務の上限
    if(worked(r)>=TARGET)return false;                            // 出勤日数の上限
    if(nights(r)>=MAXNIGHT)return false;                          // 夜勤は月8回まで
    return true;
  };
  for(let d=0;d<DAYS;d++){
    NIGHT.forEach(s=>{
      const need=minFor(s,d+1), got=[];
      for(let k=0;k<PEOPLE.length*4&&got.length<need;k++){
        const r=(p++)%PEOPLE.length;
        if(!free(r,d,s))continue;
        if(got.length===need-1 && need>1 && !got.some(reg) && !reg(r))continue;  // 看護師1名以上
        G[r][d]=s; got.push(r);
        if(s===DEEP && d+1<DAYS && !G[r][d+1]) G[r][d+1]=OFFSYM;  // 深夜の翌日は休み
      }
    });
  }
}

function solveDay(){
  const daySym=WORK.find(k=>!NIGHT.includes(k.sym)).sym;
  const cnt=d=>PEOPLE.filter((_,r)=>G[r][d]===daySym).length;
  const canPut=(r,d)=>{
    if(G[r][d])return false;
    if(KIB[r+'-'+d])return false;
    if(!PEOPLE[r].sh.includes(daySym))return false;
    const yv=at(r,d-1); if(yv&&NIGHT.includes(yv))return false;
    if(blockLen(r,d)>MAXRUN)return false;
    if(worked(r)>=TARGET)return false;
    return true;
  };
  /* ① 下限の足りない日から埋める。出勤の少ない人から */
  const dead=new Set();
  for(let guard=0;guard<DAYS*PEOPLE.length*2;guard++){
    let d=-1,mx=0;
    for(let i=0;i<DAYS;i++){ if(dead.has(i))continue;
      const n=minFor(daySym,i+1)-cnt(i); if(n>mx){mx=n; d=i} }
    if(d<0)break;
    let best=-1,bw=1e9;
    for(let r=0;r<PEOPLE.length;r++){ if(!canPut(r,d))continue;
      const w=worked(r); if(w<bw){bw=w; best=r} }
    if(best<0){dead.add(d); continue}
    G[best][d]=daySym;
  }
  /* ② 残りの出勤日数を配る。1人 TARGET 日まで */
  for(let pass=0;pass<DAYS*2;pass++){
    let moved=false;
    for(let r=0;r<PEOPLE.length;r++){
      if(worked(r)>=TARGET)continue;
      let d=-1,mn=1e9;
      for(let i=0;i<DAYS;i++){ if(!canPut(r,i))continue;
        const c=cnt(i); if(c<mn){mn=c; d=i} }
      if(d<0)continue;
      G[r][d]=daySym; moved=true;
    }
    if(!moved)break;
  }
  /* ③ 空きは休み */
  PEOPLE.forEach((_,r)=>{for(let d=0;d<DAYS;d++) if(!G[r][d]) G[r][d]=OFFSYM});
}

  return G[r][d];
}

  t.appendChild(tf);
  foot();

  if(sc==='one')   return r===K.r && w===K.w;

/* 部分再求解 — 触れるセルだけ外して、空いた枠を別の人で埋める */
function localRepair(sc,K){
  const T=G.map(x=>x.slice()), map={};
  const holes=[];
  for(let r=0;r<PEOPLE.length;r++) for(let d=0;d<DAYS;d++){
    if(T[r][d]===K.sym && matches(sc,K,r,d)){ T[r][d]=OFFSYM; map[r+'-'+d]=OFFSYM; holes.push([d,K.sym]) }
  }
  holes.forEach(([d,sym])=>{
    for(let r2=0;r2<PEOPLE.length;r2++){
      if(matches(sc,K,r2,d))continue;
      if(!PEOPLE[r2].sh.includes(sym))continue;
      if(T[r2][d]&&T[r2][d]!==OFFSYM)continue;
      if(KIB[r2+'-'+d])continue;
      const y=d>0?T[r2][d-1]:(PREV[r2]&&PREV[r2][5])||'';
      if(y&&NIGHT.includes(y))continue;
      const nt=T[r2].reduce((a,v)=>a+(NIGHT.includes(v)?1:0),0);
      if(NIGHT.includes(sym)&&nt>=8)continue;
      T[r2][d]=sym; map[r2+'-'+d]=sym;
      if(sym===DEEP&&d+1<DAYS&&T[r2][d+1]!==OFFSYM){T[r2][d+1]=OFFSYM; map[r2+'-'+(d+1)]=OFFSYM}
      break;
    }
  });
  Object.keys(map).forEach(k=>{const[r,d]=k.split('-'); if(G[+r][+d]===map[k]) delete map[k]});
  return map;
}
/* 回帰 — 取り込んだ10月末6日に当てる */
const PREVWD=()=>MONTHS[mi].prevWd, PREVD=()=>MONTHS[mi].prevDays;
function regress(sc,K){
  const hit=[];
  for(let r=0;r<PEOPLE.length;r++) for(let i=0;i<6;i++){
    const v=(PREV[r]||[])[i]; if(v!==K.sym)continue;
    const w=PREVWD()[i];
    const ok = sc==='one'?(r===K.r&&w===K.w) : sc==='allwd'?(r===K.r) : (w===K.w);
    if(ok) hit.push({r,i});
  }
  return hit;
}
function openFlow(k,nl){
  flow={k:k, K:parseKey(k), step:nl?'nlres':'fact', nl:nl, d:{}}; applied=false; renderFlow();
}
function closeFlow(){flow=null; preview=null; applied=false; renderFlow(); draw()}
function renderFlow(){
  const h=$('flowhost'); h.innerHTML='';
  dw();
  if(!flow)return;
  const c=ce('div','sec'); c.id='flow';
  const hd=ce('h2'); hd.innerHTML=(flow.nl?'言葉から決まりをつくる':'同じ直しが続いています')+
    '<span class="r">段階3</span>';
  const x=ce('button','x'); x.textContent='✕'; x.onclick=closeFlow; hd.appendChild(x); c.appendChild(hd);
  const D=flow.d;
  if(D.rule){const r=ce('div','done'); r.innerHTML='<span class="k">決まり</span><span class="v">'+D.rule+'</span>'; c.appendChild(r)}
  if(D.termL){const r=ce('div','done'); r.innerHTML='<span class="k">期限</span><span class="v">'+D.termL+'</span>'; c.appendChild(r)}
  const b=ce('div','in'); c.appendChild(b); h.appendChild(c);
  STEP[flow.step](b);
  c.scrollIntoView({block:'nearest'});
}
const row2=(b,...bs)=>{const r=ce('div','row2'); bs.forEach(([t,cl,f])=>{
  const x=ce('button',cl); x.textContent=t; x.onclick=f; r.appendChild(x)}); b.appendChild(r)};
const opt=(b,t,sub,f)=>{const o=ce('button','opt'); o.innerHTML=t+(sub?'<span class="os">'+sub+'</span>':'');
  o.onclick=f; b.appendChild(o)};

const STEP={
fact(b){
  const K=flow.K, ms=[...monthsOf(flow.k)].sort();
  b.innerHTML='<p class="q">'+PEOPLE[K.r].name+' の '+K.w+'曜の '+
    (KINDS.find(x=>x.sym===K.sym)||{}).name+' を、毎月外しています</p>'+
    '<div class="facts"><span class="big">'+ms.length+'ヶ月つづけて</span>'+
    ms.map(m=>'<code>'+m.replace('2026-','')+'月</code>').join(' ')+
    '<br><span style="color:var(--ink3)">1回目と2回目は黙っていました</span></div>'+
    '<p class="sub">毎回おなじ理由ですか。違えば今回の直しはそのまま残り、何も作られません。</p>'+
    '<div class="fake">この病棟の手直しは月'+TH.avg+'件。鍵は'+TH.K+'通りなので、'+
    TH.n+'ヶ月つづけば偶然は年0.4件以下。<b>'+TH.n+'という数字はここから出しています。</b></div>';
  row2(b,['はい、決まりにする','pri',()=>{flow.step='scope'; renderFlow()}],
         ['いいえ、今回だけ','',()=>{closeFlow(); note('今回だけの直しとして残しました','記録は消していません')}]);
},
scope(b){
  const K=flow.K, nm=PEOPLE[K.r].name, sn=(KINDS.find(x=>x.sym===K.sym)||{}).name;
  b.innerHTML='<p class="q">どこまで当てはまりますか</p>'+
    '<p class="sub">こちらで一般化はしません。選ぶのは師長です。</p>';
  opt(b,nm+' の '+K.w+'曜だけ', nm+' を '+K.w+'曜の'+sn+'に入れない',
    ()=>{Object.assign(flow.d,{sc:'one',rule:nm+' は'+K.w+'曜の'+sn+'に入らない'}); flow.step='term'; renderFlow()});
  opt(b,nm+' の'+sn+' すべて','曜日を問わず入れない',
    ()=>{Object.assign(flow.d,{sc:'allwd',rule:nm+' は'+sn+'に入らない'}); flow.step='term'; renderFlow()});
  opt(b,K.w+'曜の'+sn+' 全体（全員）',K.w+'曜に'+sn+'を置かない',
    ()=>{Object.assign(flow.d,{sc:'allp',rule:K.w+'曜に'+sn+'を置かない'}); flow.step='unsat'; renderFlow()});
},
term(b){
  b.innerHTML='<p class="q">いつまで効かせますか</p>'+
    '<p class="sub">一時的な事情が恒久の決まりになると、事情が消えた後も効き続けます。</p>';
  opt(b,'恒久','止めるのはいつでもできます',()=>{flow.d.termL='恒久'; flow.step='preview'; renderFlow()});
  opt(b,'期限つき — 2027-03-31 まで','切れたら自動で止まります',
    ()=>{flow.d.termL='2027-03-31 まで'; flow.step='preview'; renderFlow()});
},
unsat(b){
  preview=null; draw();
  b.innerHTML='<div class="box c"><div class="hd"><span class="ico c">✕</span>これは成立しません</div>'+
    '次の3本が同時に満たせません。<ul style="margin:6px 0 0;padding-left:17px;font-size:12.5px">'+
    '<li><b>'+flow.d.rule+'</b>（いま作ろうとしているもの）</li>'+
    '<li>深夜勤は毎日2人以上 <span style="color:var(--ink3)">法令</span></li>'+
    '<li>夜勤は月8回まで <span style="color:var(--ink3)">ガイドライン 基準③</span></li></ul></div>'+
    '<div class="fake"><b>ここだけ本物ではありません。</b>不充足の原因を名指しするには'+
    '最小不充足集合が要ります（CP-SAT の sufficient_assumptions_for_infeasibility）。'+
    'いまは決め打ちの文言です。</div>';
  row2(b,['範囲を狭める','pri',()=>{flow.step='scope'; renderFlow()}],
         ['やめる','',closeFlow]);
},
preview(b){
  preview={map:localRepair(flow.d.sc,flow.K)}; draw();
  const ch=Object.entries(preview.map);
  b.innerHTML='<div class="box w"><div class="hd"><span class="ico w">!</span>確定前です</div>'+
    '表が <b>'+ch.length+'箇所</b> 変わります。左の表で光っています。</div>';
  const l=ce('div'); l.style.cssText='border:1px solid var(--line);border-radius:8px;padding:8px 11px;margin-bottom:11px';
  if(!ch.length) l.innerHTML='<span style="font-size:12.5px;color:var(--ink3)">変わるところはありません</span>';
  ch.forEach(([k,v])=>{const[r,d]=k.split('-');
    const x=ce('div','chg');
    x.innerHTML='<span>'+PEOPLE[+r].name+'</span><span class="ar">11/'+(+d+1)+'('+wd(+d+1)+') '+
      '<span class="srk">'+(G[+r][+d]||'空')+'</span> → <b>'+(v||'空')+'</b></span>';
    l.appendChild(x)});
  b.appendChild(l);
  const p=ce('p','sub');
  p.innerHTML='<b>決まりの文ではなく、勤務表の差分で確かめます。</b>'+
    '触らないセルは固定したまま、空いた枠だけ埋め直しました。';
  b.appendChild(p);
  row2(b,['先月の表で確かめる','pri',()=>{flow.step='reg'; renderFlow()}],['やめる','',closeFlow]);
},
reg(b){
  const hit=regress(flow.d.sc,flow.K), K=flow.K;
  b.innerHTML='<p class="q">取り込んだ先月の表に当ててみました</p>'+
    '<div class="facts"><span class="big">10/26〜10/31 の6日で '+
    (hit.length?'違反 '+hit.length+'箇所':'違反なし')+'</span>'+
    '一般化が広すぎれば、過去の表が違反します。テストを書く作業は発生しません。</div>';
  if(hit.length){
    const r0=hit[0].r, m=ce('div');
    m.innerHTML='<div style="font-size:12px;color:var(--ink2)">'+PEOPLE[r0].name+' — 2026年10月</div>'+
      '<div class="mini"></div>';
    b.appendChild(m);
    const mi=m.querySelector('.mini');
    for(let i=0;i<6;i++){
      const v=(PREV[r0]||[])[i]||'', bad=hit.some(h=>h.r===r0&&h.i===i), d=ce('div');
      d.innerHTML='<div class="md">'+PREVD()[i].replace('10/','')+'<br>'+PREVWD()[i]+'</div>'+
        '<div class="mc" style="background:'+(v?col(v)+'22':'var(--s3)')+';color:'+(v?col(v):'var(--ink3)')+
        (bad?';outline:2px solid var(--crit);outline-offset:-2px':'')+'">'+v+'</div>';
      mi.appendChild(d);
    }
    const q=ce('p','sub'); q.style.marginTop='10px';
    q.innerHTML='10/30(金) に'+(KINDS.find(x=>x.sym===K.sym)||{}).name+'が入っています。<b>これはどちらですか。</b>'+
      '<br><span style="color:var(--ink3)">どちらも師長にしか判断できず、師長なら迷いません。</span>';
    b.appendChild(q);
    row2(b,['先月は例外だった','',()=>{flow.d.exc=1; flow.step='commit'; renderFlow()}],
           ['先月が間違いだった','pri',()=>{flow.step='commit'; renderFlow()}]);
  } else {
    b.appendChild(Object.assign(ce('div','fake'),{textContent:
      '本番では取り込んだ全期間に当てます。いまは C で入れた6日分だけです。'}));
    row2(b,['決まりにする','pri',()=>{flow.step='commit'; renderFlow()}],['やめる','',closeFlow]);
  }
},
commit(b){
  const D=flow.d, K=flow.K;
  if(!applied){
    const rev={};
    Object.entries(preview.map).forEach(([k,v])=>{const[r,d]=k.split('-');
      rev[k]=G[+r][+d]; G[+r][+d]=v});
    MYRULES.unshift({key:flow.k, t:D.rule, sc:D.sc, K:K, term:D.termL, rev:rev,
      src: flow.nl ? '師長の言葉「'+flow.nl+'」から' :
           [...monthsOf(flow.k)].sort().map(m=>m.replace('2026-','')+'月').join('・')+' の手直しから',
      exc: D.exc?'2026-10 は例外として記録':''});
    applied=true; preview=null; draw(); drawRules();
  }
  b.innerHTML='<div class="box ok"><div class="hd"><span class="ico ok">✓</span>決まりができました</div>'+
    '<b style="font-size:14px">'+D.rule+'</b>'+
    '<ul style="margin:7px 0 0;padding-left:17px;font-size:12.5px">'+
    '<li>期限 — '+D.termL+'</li>'+
    '<li>由来 — '+MYRULES[0].src+' / 承認 師長 2026-11-08</li>'+
    (D.exc?'<li>例外 — 2026-10 は例外として記録</li>':'')+
    '<li>これから解くときに効きます</li></ul></div>'+
    '<p class="sub">この由来が、次の師長への引き継ぎになります。止めるのはいつでも、承認する人なしで。</p>';
  row2(b,['閉じる','pri',closeFlow]);
},
/* 言葉から — セルの「これは駄目」から来る */
write(b){
  const K=flow.K;
  b.innerHTML='<p class="q">このマスについて、思っていることを書いてください</p>'+
    '<p class="sub">'+PEOPLE[K.r].name+' · 11/'+'？'+' ('+K.w+') · いま '+K.sym+
    '<br><b>LLMが出るのはここだけです。</b>解くことには関わりません。</p>';
  const ta=ce('textarea'); ta.placeholder='例） 金曜は子どもの迎えがあるから夜勤は無理';
  ta.value='金曜は子どもの迎えがあるから夜勤は無理'; b.appendChild(ta);
  row2(b,['決まりにする','pri',()=>{flow.nl=ta.value.trim()||ta.placeholder.replace('例） ','');
    flow.step='think'; renderFlow()}],['やめる','',closeFlow]);
  setTimeout(()=>ta.focus(),0);
},
think(b){
  b.innerHTML='<p class="sub"><span class="sp"></span> 言葉を決まりに訳しています…</p>';
  setTimeout(()=>{if(flow&&flow.step==='think'){flow.step='nlres'; renderFlow()}},900);
},
nlres(b){
  const K=flow.K, nm=PEOPLE[K.r].name, amb=/夜勤|夜/.test(flow.nl)&&!/深夜|準夜/.test(flow.nl);
  b.innerHTML='<p class="q">言葉をこう受け取りました</p><div class="quote">'+flow.nl+'</div>'+
    '<div class="facts"><span class="big">'+nm+' は '+K.w+'曜 の '+
    (amb?'夜勤':(KINDS.find(x=>x.sym===K.sym)||{}).name)+' に入らない</span>'+
    '指したセルが決まっているので、訳すのは<b>1本だけ</b>です。</div>';
  if(amb){
    const w=ce('div','box w');
    w.innerHTML='<div class="hd"><span class="ico w">?</span>はっきりしない言葉があります</div>'+
      '「<b>夜勤</b>」はこの病棟では '+NIGHT.map(x=>(KINDS.find(y=>y.sym===x)||{}).name).join(' と ')+
      ' に分かれています。どちらですか。';
    b.appendChild(w);
    row2(b,[(KINDS.find(x=>x.sym===K.sym)||{}).name+'だけ','pri',()=>{flow.step='scope'; renderFlow()}],
           ['両方','',()=>{flow.step='scope'; renderFlow()}]);
  } else row2(b,['これで合っている','pri',()=>{flow.step='scope'; renderFlow()}],['やめる','',closeFlow]);
}};

/* ===== 決まりの一覧 ===== */
function drawRules(){
  const h=$('ruleshost');
  [...h.querySelectorAll('.sec')].forEach(x=>{if(x.id!=='deaths')x.remove()});
  dw();
  if(!MYRULES.length)return;
  const c=ce('div','sec');
  c.innerHTML='<h2>この病棟の決まり<span class="r">'+
    MYRULES.filter(r=>!r.stopped).length+' / '+MYRULES.length+'本'+
    '</span></h2>';
  MYRULES.forEach((r,i)=>{
    const d=ce('div','rule');
    d.innerHTML='<div class="rt"><span'+(r.stopped?' style="text-decoration:line-through;opacity:.5"':'')+
      '>'+r.t+'</span>'+
      (r.pre?'':'<span class="tag new">新規</span>')+
      (r.stopped?'<span class="tag">期限切れで停止</span>':'')+'</div>'+
      '<div class="rm">由来: '+r.src+'<br>期限: '+r.term+
      (r.exc?'<br>'+r.exc:'')+(r.last?'<br>最後に効いた: '+r.last:'')+'</div>';
    if(!r.pre){
      const b=ce('button','add'); b.textContent='元に戻す';
      b.style.cssText='margin-top:7px;font-size:12px;padding:5px 11px';
      b.onclick=()=>{ Object.entries(r.rev||{}).forEach(([k,v])=>{const[rr,dd]=k.split('-');
          if(+dd<DAYS)G[+rr][+dd]=v});
        MYRULES.splice(i,1); drawRules(); draw(); note('決まりを取り消しました','表も戻しました')};
      d.appendChild(b);
    }
    c.appendChild(d);
  });
  const f=ce('div','in'); f.style.borderTop='1px solid var(--line2)';
  const hb=ce('button','add'); hb.textContent='引き継ぎに書き出す';
  hb.onclick=()=>{ try{sessionStorage.setItem('myrules',JSON.stringify(MYRULES));
      sessionStorage.setItem('ward',ward)}catch(e){}
    location.href='handover.html'};
  f.appendChild(hb); c.appendChild(f);
  h.appendChild(c);
}
function dw(){
  const on=!!flow||MYRULES.length>0;
  $('dw').classList.toggle('on',on); document.body.classList.toggle('dw',on);
}

draw();
</script>
